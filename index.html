<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유치원 수업 검색 시스템</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-decor"></div>

    <main class="app-container">
        <!-- Search Section -->
        <section id="search-section" class="search-container centered">
            <h1 class="main-title">어떤 수업을 찾으시나요?</h1>
            <div class="search-box-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="동화책 제목을 입력하세요 (예: 민들레는 민들레)" autocomplete="off">
                <button id="search-btn">검색</button>
            </div>
            <p class="search-hint">추천 도서: 민들레는 민들레, 무지개 물고기</p>
        </section>

        <!-- Results Section (Hidden by default) -->
        <section id="results-section" class="results-container hidden">
            <button id="back-btn" class="back-button"><i class="fas fa-arrow-left"></i> 다시 검색하기</button>

            <div id="lesson-content">
                <!-- Content will be injected here by JS -->
            </div>
        </section>

        <!-- No Results Message -->
        <div id="no-results" class="no-results hidden">
            <div class="icon-box">😢</div>
            <h2>검색 결과가 없습니다</h2>
            <p>정확한 도서명을 입력했는지 확인해주세요.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
